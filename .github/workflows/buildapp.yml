# Original idea by @ISnackable. Thanks to him for handling the hardest parts!
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml

name: Build and Release uYouEnhanced

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "18.6"
        required: true
        type: string

      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string

      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube IPA"
        default: ""
        required: true
        type: string

      bundle_id:
        description: "Modify the bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string

      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string

      upload_artifact:
        description: "Upload IPA as artifact"
        default: true
        required: false
        type: boolean

      create_release:
        description: "Create a draft release"
        default: true
        required: false
        type: boolean

      ytuhd:
        description: "Include YTUHD"
        default: false
        required: false
        type: boolean

      sponsorblock:
        description: "Include iSponsorBlock"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-latest

    permissions:
      contents: write

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # Initialize submodules
      # ============================================================

      - name: Initialize and Update Submodules
        run: |
          set -euo pipefail

          cd main

          echo "========================================"
          echo "Synchronizing repository submodules"
          echo "========================================"

          git submodule sync --recursive
          git submodule update --init --recursive

          echo ""
          echo "=== Main submodule status ==="
          git submodule status --recursive

          if [ -d "Tweaks/YTUHD" ]; then
            echo ""
            echo "========================================"
            echo "Synchronizing YTUHD nested submodules"
            echo "========================================"

            git -C Tweaks/YTUHD submodule sync --recursive
            git -C Tweaks/YTUHD submodule update --init --recursive

            echo ""
            echo "=== YTUHD submodule status ==="
            git -C Tweaks/YTUHD submodule status --recursive || true

            echo ""
            echo "=== YTUHD vendor directory ==="
            ls -la Tweaks/YTUHD/vendor || true

            echo ""
            echo "=== libvpx source ==="
            ls -la Tweaks/YTUHD/vendor/libvpx || true

            echo ""
            echo "=== dav1d source ==="
            ls -la Tweaks/YTUHD/vendor/dav1d || true
          fi

      # ============================================================
      # Dependencies
      # ============================================================

      - name: Install Dependencies
        run: |
          set -euo pipefail

          brew install \
            ldid \
            dpkg \
            make \
            wget \
            unzip \
            jq \
            pipx \
            meson \
            ninja

      - name: Set PATH
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # ============================================================
      # Theos
      # ============================================================

      - name: Setup Theos
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          key: iOS-${{ inputs.sdk_version }}-SDK

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          git clone \
            --quiet \
            -n \
            --depth=1 \
            --filter=tree:0 \
            https://github.com/aricloverALT/sdks/ \
            sdks

          cd sdks

          git sparse-checkout set \
            --no-cone \
            iPhoneOS${{ inputs.sdk_version }}.sdk

          git checkout --quiet

          mv *.sdk "$THEOS/sdks"

      # ============================================================
      # Theos Jailed
      # ============================================================

      - name: Setup Theos Jailed
        uses: actions/checkout@v7
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed

      - name: Install Theos Jailed
        run: |
          set -euo pipefail
          ./theos-jailed/install

      # ============================================================
      # Theos broken-pipe workaround
      # ============================================================

      - name: Fix Theos broken pipe issue
        run: |
          set -euo pipefail

          echo "THEOS=$THEOS"

          find "$THEOS" -name "*.sh" -type f | while read -r SCRIPT; do
            if grep -q '| head' "$SCRIPT" 2>/dev/null; then
              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$SCRIPT" \
                2>/dev/null || true

              echo "Patched: $SCRIPT"
            fi
          done

          find "$THEOS" -name "*.mk" -type f | while read -r MK; do
            if grep -q '| head' "$MK" 2>/dev/null; then
              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$MK" \
                2>/dev/null || true

              echo "Patched: $MK"
            fi
          done

          echo "Broken pipe fixes applied"

      # ============================================================
      # cyan and tbd
      # ============================================================

      - name: Install cyan and tbd
        run: |
          set -euo pipefail

          pipx install \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          wget \
            --quiet \
            "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" \
            -O /usr/local/bin/tbd

          chmod +x /usr/local/bin/tbd

      # ============================================================
      # YouTube IPA
      # ============================================================

      - name: Hash YT ipa url
        run: |
          set -euo pipefail

          URL_YT="$(jq -r '.inputs.decrypted_youtube_url' "$GITHUB_EVENT_PATH")"

          echo "::add-mask::$URL_YT"
          echo "URL_YT=$URL_YT" >> "$GITHUB_ENV"

      - name: Prepare YouTube IPA
        id: prepare_youtube
        run: |
          set -euo pipefail

          wget \
            "$YOUTUBE_URL" \
            --quiet \
            -O main/YouTube.ipa

          cd main

          mv YouTube.ipa YouTube.zip
          unzip -q YouTube.zip

          youtube_version=$(
            defaults read \
              "$(pwd)/Payload/YouTube.app/Info" \
              CFBundleVersion
          )

          echo "YT_VERSION=$youtube_version" >> "$GITHUB_ENV"
          echo "youtube_version=${youtube_version}" >> "$GITHUB_OUTPUT"

          echo "Detected YouTube version: $youtube_version"
        env:
          YOUTUBE_URL: ${{ env.URL_YT }}

      # ============================================================
      # Validate YTUHD sources
      # ============================================================

      - name: Validate YTUHD Codec Sources
        if: ${{ inputs.ytuhd }}
        run: |
          set -euo pipefail

          cd main/Tweaks/YTUHD

          echo "========================================"
          echo "Validating YTUHD codec dependencies"
          echo "========================================"

          echo ""
          echo "YTUHD directory:"
          pwd

          if [ ! -f "vendor/libvpx/vpx/vpx_decoder.h" ]; then
            echo ""
            echo "libvpx header missing."
            echo "Retrying submodule initialization..."

            git submodule sync --recursive
            git submodule update --init --recursive
          fi

          if [ ! -f "vendor/dav1d/include/dav1d/dav1d.h" ]; then
            echo ""
            echo "dav1d header missing."
            echo "Retrying submodule initialization..."

            git submodule sync --recursive
            git submodule update --init --recursive
          fi

          echo ""
          echo "========================================"
          echo "Final source verification"
          echo "========================================"

          test -f vendor/libvpx/vpx/vpx_decoder.h || {
            echo "FATAL: Missing vendor/libvpx/vpx/vpx_decoder.h"
            exit 1
          }

          test -f vendor/dav1d/include/dav1d/dav1d.h || {
            echo "FATAL: Missing vendor/dav1d/include/dav1d/dav1d.h"
            exit 1
          }

          echo ""
          echo "Found libvpx header:"
          ls -lh vendor/libvpx/vpx/vpx_decoder.h

          echo ""
          echo "Found dav1d header:"
          ls -lh vendor/dav1d/include/dav1d/dav1d.h

          echo ""
          echo "Codec sources validated successfully."

      # ============================================================
      # Build YTUHD codec libraries
      # ============================================================

      - name: Build YTUHD Codec Libraries
        if: ${{ inputs.ytuhd }}
        run: |
          set -euo pipefail

          cd main/Tweaks/YTUHD

          echo "========================================"
          echo "YTUHD Codec Build Environment"
          echo "========================================"

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "clang:"
          clang --version | head -n 1 || true

          echo ""
          echo "meson:"
          meson --version

          echo ""
          echo "ninja:"
          ninja --version

          echo ""
          echo "make:"
          make --version | head -n 1 || true

          echo ""
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo ""
          echo "Making codec build scripts executable..."

          chmod +x vendor/build_libvpx.sh
          chmod +x vendor/build_dav1d.sh

          echo ""
          echo "Cleaning previous codec build outputs..."

          rm -rf vendor/libvpx_ios
          rm -rf vendor/dav1d_ios

          echo ""
          echo "========================================"
          echo "Building libvpx"
          echo "========================================"

          ./vendor/build_libvpx.sh

          echo ""
          echo "========================================"
          echo "Building dav1d"
          echo "========================================"

          ./vendor/build_dav1d.sh

          echo ""
          echo "========================================"
          echo "Validating codec build outputs"
          echo "========================================"

          test -f vendor/libvpx_ios/libvpx.a || {
            echo "FATAL: libvpx.a was not created."
            exit 1
          }

          test -f vendor/dav1d_ios/libdav1d.a || {
            echo "FATAL: libdav1d.a was not created."
            exit 1
          }

          test -f vendor/dav1d_ios/install/include/dav1d/dav1d.h || {
            echo "FATAL: installed dav1d headers were not created."
            exit 1
          }

          echo ""
          echo "libvpx:"
          ls -lh vendor/libvpx_ios/libvpx.a

          echo ""
          echo "dav1d:"
          ls -lh vendor/dav1d_ios/libdav1d.a

          echo ""
          echo "dav1d headers:"
          ls -la vendor/dav1d_ios/install/include/dav1d/

          echo ""
          echo "libvpx architecture:"
          lipo -info vendor/libvpx_ios/libvpx.a \
            || file vendor/libvpx_ios/libvpx.a

          echo ""
          echo "dav1d architecture:"
          lipo -info vendor/dav1d_ios/libdav1d.a \
            || file vendor/dav1d_ios/libdav1d.a

          echo ""
          echo "YTUHD codec libraries built successfully."

      # ============================================================
      # Fix YTUHD paths for aggregate Theos build
      # ============================================================

      - name: Fix YTUHD Paths for Aggregate Build
        if: ${{ inputs.ytuhd }}
        run: |
          set -euo pipefail

          cd main/Tweaks/YTUHD

          echo "========================================"
          echo "Patching YTUHD paths"
          echo "========================================"

          echo ""
          echo "Makefile before patch:"
          echo "----------------------------------------"
          cat Makefile

          python3 <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text()

          marker = "YTUHD_ROOT := $(abspath $(dir $(lastword $(MAKEFILE_LIST))))"

          if marker not in text:
              text = marker + "\n\n" + text

          text = text.replace(
              "$(THEOS_PROJECT_DIR)/vendor",
              "$(YTUHD_ROOT)/vendor"
          )

          path.write_text(text)
          PY

          echo ""
          echo "Makefile after patch:"
          echo "----------------------------------------"
          cat Makefile

          echo ""
          echo "Checking patched paths..."

          if grep -q '\$(THEOS_PROJECT_DIR)/vendor' Makefile; then
            echo "FATAL: Unpatched THEOS_PROJECT_DIR vendor paths remain."
            grep -n '\$(THEOS_PROJECT_DIR)/vendor' Makefile || true
            exit 1
          fi

          grep -n 'YTUHD_ROOT' Makefile

          echo ""
          echo "Verifying required YTUHD files..."

          test -f vendor/libvpx/vpx/vpx_decoder.h
          test -f vendor/dav1d/include/dav1d/dav1d.h
          test -f vendor/libvpx_ios/libvpx.a
          test -f vendor/dav1d_ios/libdav1d.a
          test -f vendor/dav1d_ios/install/include/dav1d/dav1d.h

          echo ""
          echo "YTUHD path patch complete."

      # ============================================================
      # Verify YTUHD include paths
      # ============================================================

      - name: Verify YTUHD Include Paths
        if: ${{ inputs.ytuhd }}
        run: |
          set -euo pipefail

          YTUHD_DIR="$GITHUB_WORKSPACE/main/Tweaks/YTUHD"

          echo "========================================"
          echo "Expected YTUHD compiler include paths"
          echo "========================================"

          echo "-I${YTUHD_DIR}/vendor/libvpx"
          echo "-I${YTUHD_DIR}/vendor/libvpx_ios"
          echo "-I${YTUHD_DIR}/vendor/dav1d/include"
          echo "-I${YTUHD_DIR}/vendor/dav1d_ios/install/include"

          echo ""
          echo "========================================"
          echo "Testing vpx header"
          echo "========================================"

          printf '#include <vpx/vpx_decoder.h>\n' > /tmp/test_vpx.m

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -I"${YTUHD_DIR}/vendor/libvpx" \
            -E \
            /tmp/test_vpx.m \
            >/dev/null

          echo "PASS: vpx/vpx_decoder.h resolved."

          echo ""
          echo "========================================"
          echo "Testing dav1d header"
          echo "========================================"

          printf '#include <dav1d/dav1d.h>\n' > /tmp/test_dav1d.m

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -I"${YTUHD_DIR}/vendor/dav1d/include" \
            -I"${YTUHD_DIR}/vendor/dav1d_ios/install/include" \
            -E \
            /tmp/test_dav1d.m \
            >/dev/null

          echo "PASS: dav1d/dav1d.h resolved."

      # ============================================================
      # Build package
      #
      # SIDELOAD=1 is important for YTUHD.
      # It uses the bundled libundirect_compact implementation rather
      # than trying to link the external "undirect" library.
      # ============================================================

      - name: Fix compiling & Build Package
        id: build_package
        run: |
          set -euo pipefail

          cd main

          sed -i '' \
            "s/^BUNDLE_ID .*/BUNDLE_ID = ${{ inputs.bundle_id }}/" \
            Makefile \
            || echo "BUNDLE_ID = ${{ inputs.bundle_id }}" >> Makefile

          sed -i '' \
            "s/^DISPLAY_NAME .*/DISPLAY_NAME = ${{ inputs.app_name }}/" \
            Makefile \
            || echo "DISPLAY_NAME = ${{ inputs.app_name }}" >> Makefile

          sed -i '' \
            "s/^export TARGET .*/export TARGET = iphone:clang:${{ inputs.sdk_version }}:16.0/" \
            Makefile \
            || echo "export TARGET = iphone:clang:${{ inputs.sdk_version }}:16.0" >> Makefile

          echo ""
          echo "========================================"
          echo "Starting uYouEnhanced build"
          echo "========================================"

          echo "THEOS=$THEOS"
          echo "SDK=${{ inputs.sdk_version }}"
          echo "Bundle ID=${{ inputs.bundle_id }}"
          echo "App Name=${{ inputs.app_name }}"
          echo "SIDELOAD=1"
          echo "YTUHD_ENABLED=${{ inputs.ytuhd && '1' || '0' }}"
          echo "SPONSORBLOCK_ENABLED=${{ inputs.sponsorblock && '1' || '0' }}"

          echo ""
          echo "========================================"
          echo "Building"
          echo "========================================"

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            IPA=Payload/YouTube.app \
            FINALPACKAGE=1 \
            SIDELOAD=1 \
            YTUHD_ENABLED=${{ inputs.ytuhd && '1' || '0' }} \
            SPONSORBLOCK_ENABLED=${{ inputs.sponsorblock && '1' || '0' }}

          echo ""
          echo "========================================"
          echo "Build completed"
          echo "========================================"

          PACKAGE_FILE="$(ls -t packages/*.ipa 2>/dev/null | head -n1 || true)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "FATAL: No IPA was created in main/packages."
            echo ""
            echo "Contents of packages:"
            ls -lah packages || true
            exit 1
          fi

          PACKAGE_NAME="$(basename "$PACKAGE_FILE")"

          echo "Package: $PACKAGE_NAME"
          echo "Full path: $(pwd)/$PACKAGE_FILE"

          echo "package=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_path=$(pwd)/$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

          echo ""
          echo "SHA256:"
          shasum -a 256 "$PACKAGE_FILE"
        env:
          UYOU_VERSION: ${{ inputs.uyou_version }}

      # ============================================================
      # Verify final IPA
      # ============================================================

      - name: Verify Final IPA
        id: final_ipa
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Locating final IPA"
          echo "========================================"

          echo ""
          echo "All IPA files in main/packages:"
          find "$GITHUB_WORKSPACE/main/packages" \
            -maxdepth 1 \
            -type f \
            -name "*.ipa" \
            -print \
            || true

          IPA_FILE="$GITHUB_WORKSPACE/main/packages/${{ steps.build_package.outputs.package }}"

          if [ ! -f "$IPA_FILE" ]; then
            echo ""
            echo "Expected IPA was not found:"
            echo "$IPA_FILE"

            echo ""
            echo "Attempting fallback search..."

            IPA_FILE="$(
              find "$GITHUB_WORKSPACE/main/packages" \
                -maxdepth 1 \
                -type f \
                -name "*.ipa" \
                -print0 \
                | xargs -0 ls -t \
                | head -n1 \
                || true
            )"
          fi

          if [ -z "$IPA_FILE" ] || [ ! -f "$IPA_FILE" ]; then
            echo "FATAL: No final IPA could be located."
            exit 1
          fi

          IPA_NAME="$(basename "$IPA_FILE")"

          echo ""
          echo "Final IPA:"
          echo "$IPA_FILE"

          echo ""
          echo "File information:"
          ls -lh "$IPA_FILE"

          echo ""
          echo "SHA256:"
          shasum -a 256 "$IPA_FILE"

          echo "path=$IPA_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Upload downloadable GitHub Actions artifact
      #
      # This is what makes the IPA appear at the bottom of the run.
      # ============================================================

      - name: Upload IPA Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: uYouEnhanced_${{ steps.prepare_youtube.outputs.youtube_version }}_${{ inputs.uyou_version }}_run-${{ github.run_number }}
          path: ${{ steps.final_ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ============================================================
      # Optional draft GitHub release
      # ============================================================

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prepare_youtube.outputs.youtube_version }}-${{ inputs.uyou_version }}-${{ github.run_number }}
          name: uYouEnhanced ${{ steps.prepare_youtube.outputs.youtube_version }}-${{ inputs.uyou_version }} (Run ${{ github.run_number }})
          draft: true
          prerelease: false
          generate_release_notes: false
          files: ${{ steps.final_ipa.outputs.path }}
          body: |
            uYouEnhanced build

            YouTube: ${{ steps.prepare_youtube.outputs.youtube_version }}
            uYou: ${{ inputs.uyou_version }}
            Bundle ID: ${{ inputs.bundle_id }}
            YTUHD: ${{ inputs.ytuhd }}
            iSponsorBlock: ${{ inputs.sponsorblock }}
            GitHub Actions Run: ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Safari extension
      #
      # Kept from your existing workflow.
      # ============================================================

      - name: Clone Open in YouTube (Safari Extension)
        run: |
          set -euo pipefail

          git clone \
            --quiet \
            -n \
            --depth=1 \
            --filter=tree:0 \
            https://github.com/BillyCurtis/OpenYouTubeSafariExtension.git \
            OpenYouTubeSafariExtension

          cd OpenYouTubeSafariExtension

          git sparse-checkout set \
            --no-cone \
            OpenYouTubeSafariExtension.appex

          git checkout --quiet

          mv *.appex ..

      # ============================================================
      # Normalize extension bundle IDs
      # ============================================================

      - name: Normalize Extension Bundle ID for SideStore
        run: |
          set -euo pipefail

          PARENT_BUNDLE="${{ inputs.bundle_id }}"
          ORIG_PREFIX="com.google.ios.youtube"

          echo "Normalizing extension CFBundleIdentifier(s)"
          echo "Parent: ${PARENT_BUNDLE}"

          update_plist_id() {
            PLIST_PATH="$1"

            if [ ! -f "$PLIST_PATH" ]; then
              return
            fi

            /usr/bin/plutil \
              -convert xml1 \
              "$PLIST_PATH" \
              >/dev/null 2>&1 || true

            CURRENT_ID=$(
              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleIdentifier" \
                "$PLIST_PATH" \
                2>/dev/null || true
            )

            if [ -z "$CURRENT_ID" ]; then
              return
            fi

            if [[ "$CURRENT_ID" == "$ORIG_PREFIX"* ]]; then
              SUFFIX="${CURRENT_ID#${ORIG_PREFIX}.}"

              if [ "$SUFFIX" = "$CURRENT_ID" ]; then
                SUFFIX="Extension"
              fi

              NEW_ID="${PARENT_BUNDLE}.${SUFFIX}"

              echo ""
              echo "Updating:"
              echo "$PLIST_PATH"
              echo "$CURRENT_ID -> $NEW_ID"

              /usr/libexec/PlistBuddy \
                -c "Set :CFBundleIdentifier $NEW_ID" \
                "$PLIST_PATH" \
                || \
              /usr/libexec/PlistBuddy \
                -c "Add :CFBundleIdentifier string $NEW_ID" \
                "$PLIST_PATH" \
                || true
            else
              echo ""
              echo "Skipping $PLIST_PATH"
              echo "Current ID does not start with $ORIG_PREFIX:"
              echo "$CURRENT_ID"
            fi
          }

          for appex in *.appex; do
            if [ -d "$appex" ]; then
              PLIST="$appex/Info.plist"

              update_plist_id "$PLIST"

              find "$appex" \
                \( \
                  -type f -name "*.plist" \
                  -o \
                  -type f -name "*.entitlements" \
                \) \
                | while read -r f; do

                    /usr/bin/plutil \
                      -convert xml1 \
                      "$f" \
                      >/dev/null 2>&1 || true

                    if grep -q "$ORIG_PREFIX" "$f" >/dev/null 2>&1; then
                      echo "Found original prefix in: $f"
                    fi
                  done
            fi
          done
