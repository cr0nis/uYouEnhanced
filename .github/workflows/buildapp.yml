# Original idea by @ISnackable. Thanks to him for handling the hardest parts!
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml

name: Build and Release uYouEnhanced

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "Build SDK version (not your device iOS version)"
        default: "18.6"
        required: true
        type: string

      uyou_version:
        description: "uYou source version (3.0.4 becomes unofficial 3.0.5)"
        default: "3.0.4"
        required: true
        type: string

      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube IPA"
        default: ""
        required: true
        type: string

      bundle_id:
        description: "Modify the bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string

      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string

      upload_artifact:
        description: "Upload IPA as artifact"
        default: true
        required: false
        type: boolean

      create_release:
        description: "Create a draft release"
        default: true
        required: false
        type: boolean

      ytuhd:
        description: "Include YTUHD"
        default: false
        required: false
        type: boolean

      sponsorblock:
        description: "Include iSponsorBlock"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-latest

    permissions:
      contents: write

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # Submodules
      # ============================================================

      - name: Sync Submodules
        run: |
          set -euo pipefail

          cd main

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "Submodules:"
          git submodule status --recursive

      # ============================================================
      # YTUHD metadata for codec cache
      # ============================================================

      - name: Get YTUHD Codec Versions
        if: ${{ inputs.ytuhd }}
        id: ytuhd_versions
        run: |
          set -euo pipefail

          YTUHD_DIR="$GITHUB_WORKSPACE/main/Tweaks/YTUHD"

          test -d "$YTUHD_DIR"
          test -d "$YTUHD_DIR/vendor/libvpx"
          test -d "$YTUHD_DIR/vendor/dav1d"

          YTUHD_COMMIT="$(git -C "$YTUHD_DIR" rev-parse HEAD)"
          LIBVPX_COMMIT="$(git -C "$YTUHD_DIR/vendor/libvpx" rev-parse HEAD)"
          DAV1D_COMMIT="$(git -C "$YTUHD_DIR/vendor/dav1d" rev-parse HEAD)"

          CACHE_KEY="${YTUHD_COMMIT}-${LIBVPX_COMMIT}-${DAV1D_COMMIT}"

          echo "YTUHD:  $YTUHD_COMMIT"
          echo "libvpx: $LIBVPX_COMMIT"
          echo "dav1d:  $DAV1D_COMMIT"

          echo "cache_key=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache YTUHD Codec Libraries
        if: ${{ inputs.ytuhd }}
        id: ytuhd_codec_cache
        uses: actions/cache@v6
        with:
          path: |
            main/Tweaks/YTUHD/vendor/libvpx_ios
            main/Tweaks/YTUHD/vendor/dav1d_ios
          key: >-
            ytuhd-codecs-${{ runner.os }}-sdk-${{ inputs.sdk_version }}-${{
            steps.ytuhd_versions.outputs.cache_key }}

      # ============================================================
      # Core dependencies
      # ============================================================

      - name: Install Core Dependencies
        run: |
          set -euo pipefail

          brew install \
            ldid \
            dpkg \
            make \
            wget \
            unzip \
            jq \
            pipx

      - name: Install YTUHD Codec Build Dependencies
        if: ${{ inputs.ytuhd && steps.ytuhd_codec_cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail

          brew install meson ninja

      - name: Set PATH
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # ============================================================
      # Theos
      # ============================================================

      - name: Setup Theos
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      # ============================================================
      # iOS SDK
      # ============================================================

      - name: Cache iOS SDK
        id: sdk_cache
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          key: iOS-${{ inputs.sdk_version }}-SDK

      - name: Download iOS SDK
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          git clone \
            --quiet \
            -n \
            --depth=1 \
            --filter=tree:0 \
            https://github.com/aricloverALT/sdks/ \
            sdks

          cd sdks

          SDK_NAME="iPhoneOS${{ inputs.sdk_version }}.sdk"

          echo "Downloading $SDK_NAME"

          git sparse-checkout set --no-cone "$SDK_NAME"
          git checkout --quiet

          if [ ! -d "$SDK_NAME" ]; then
            echo "FATAL: $SDK_NAME was not found in the SDK repository."
            exit 1
          fi

          mv "$SDK_NAME" "$THEOS/sdks/"

      - name: Verify iOS SDK
        run: |
          set -euo pipefail

          SDK_PATH="$THEOS/sdks/iPhoneOS${{ inputs.sdk_version }}.sdk"

          if [ ! -d "$SDK_PATH" ]; then
            echo "FATAL: Expected SDK not found:"
            echo "$SDK_PATH"
            exit 1
          fi

          echo "Using build SDK:"
          echo "$SDK_PATH"

      # ============================================================
      # Theos Jailed
      # ============================================================

      - name: Setup Theos Jailed
        uses: actions/checkout@v7
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed
          submodules: recursive

      - name: Install Theos Jailed
        run: |
          set -euo pipefail
          ./theos-jailed/install

      # ============================================================
      # Existing Theos broken-pipe workaround
      # ============================================================

      - name: Fix Theos Broken Pipe Issue
        run: |
          set -euo pipefail

          find "$THEOS" -name "*.sh" -type f | while read -r SCRIPT; do
            if grep -q '| head' "$SCRIPT" 2>/dev/null; then
              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$SCRIPT" \
                2>/dev/null || true
            fi
          done

          find "$THEOS" -name "*.mk" -type f | while read -r MK; do
            if grep -q '| head' "$MK" 2>/dev/null; then
              sed -i '' \
                's/| head/2>\/dev\/null | head/g' \
                "$MK" \
                2>/dev/null || true
            fi
          done

          echo "Theos broken-pipe workaround applied."

      # ============================================================
      # Packaging utilities
      # ============================================================

      - name: Install cyan and tbd
        run: |
          set -euo pipefail

          pipx install \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          wget \
            --quiet \
            "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" \
            -O /usr/local/bin/tbd

          chmod +x /usr/local/bin/tbd

      # ============================================================
      # YouTube IPA
      # ============================================================

      - name: Read YouTube IPA URL
        run: |
          set -euo pipefail

          URL_YT="$(jq -r '.inputs.decrypted_youtube_url' "$GITHUB_EVENT_PATH")"

          if [ -z "$URL_YT" ] || [ "$URL_YT" = "null" ]; then
            echo "FATAL: No decrypted YouTube IPA URL was supplied."
            exit 1
          fi

          echo "::add-mask::$URL_YT"
          echo "URL_YT=$URL_YT" >> "$GITHUB_ENV"

      - name: Prepare YouTube IPA
        id: prepare_youtube
        env:
          YOUTUBE_URL: ${{ env.URL_YT }}
        run: |
          set -euo pipefail

          wget \
            "$YOUTUBE_URL" \
            --quiet \
            -O main/YouTube.ipa

          cd main

          mv YouTube.ipa YouTube.zip
          unzip -q YouTube.zip

          if [ ! -d "Payload/YouTube.app" ]; then
            echo "FATAL: Payload/YouTube.app was not found."
            exit 1
          fi

          YOUTUBE_VERSION="$(
            defaults read \
              "$(pwd)/Payload/YouTube.app/Info" \
              CFBundleVersion
          )"

          if [ -z "$YOUTUBE_VERSION" ]; then
            echo "FATAL: Unable to determine YouTube version."
            exit 1
          fi

          echo "Detected YouTube version: $YOUTUBE_VERSION"

          echo "YT_VERSION=$YOUTUBE_VERSION" >> "$GITHUB_ENV"
          echo "youtube_version=$YOUTUBE_VERSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Resolve effective uYou version
      #
      # Current source package is 3.0.4 and the repository rebrands
      # that binary as unofficial 3.0.5.
      # ============================================================

      - name: Resolve uYou Build Version
        id: uyou_version
        run: |
          set -euo pipefail

          SOURCE_VERSION="${{ inputs.uyou_version }}"

          if [ "$SOURCE_VERSION" = "3.0.4" ]; then
            EFFECTIVE_VERSION="3.0.5"
          else
            EFFECTIVE_VERSION="$SOURCE_VERSION"
          fi

          echo "uYou source version:    $SOURCE_VERSION"
          echo "uYou packaged version:  $EFFECTIVE_VERSION"

          echo "effective_version=$EFFECTIVE_VERSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # YTUHD source validation
      # ============================================================

      - name: Validate YTUHD Sources
        if: ${{ inputs.ytuhd }}
        run: |
          set -euo pipefail

          cd main/Tweaks/YTUHD

          test -f vendor/libvpx/vpx/vpx_decoder.h || {
            echo "FATAL: Missing libvpx headers."
            exit 1
          }

          test -f vendor/dav1d/include/dav1d/dav1d.h || {
            echo "FATAL: Missing dav1d headers."
            exit 1
          }

          test -f vendor/build_libvpx.sh || {
            echo "FATAL: Missing libvpx build script."
            exit 1
          }

          test -f vendor/build_dav1d.sh || {
            echo "FATAL: Missing dav1d build script."
            exit 1
          }

          echo "YTUHD codec sources validated."

      # ============================================================
      # Build YTUHD codecs only when cache is missing
      # ============================================================

      - name: Build YTUHD Codec Libraries
        if: ${{ inputs.ytuhd && steps.ytuhd_codec_cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail

          cd main/Tweaks/YTUHD

          chmod +x vendor/build_libvpx.sh
          chmod +x vendor/build_dav1d.sh

          rm -rf vendor/libvpx_ios
          rm -rf vendor/dav1d_ios

          echo "Building libvpx..."
          ./vendor/build_libvpx.sh

          echo "Building dav1d..."
          ./vendor/build_dav1d.sh

      - name: Validate YTUHD Codec Outputs
        if: ${{ inputs.ytuhd }}
        run: |
          set -euo pipefail

          cd main/Tweaks/YTUHD

          test -f vendor/libvpx_ios/libvpx.a || {
            echo "FATAL: vendor/libvpx_ios/libvpx.a is missing."
            exit 1
          }

          test -f vendor/dav1d_ios/libdav1d.a || {
            echo "FATAL: vendor/dav1d_ios/libdav1d.a is missing."
            exit 1
          }

          test -f vendor/dav1d_ios/install/include/dav1d/dav1d.h || {
            echo "FATAL: installed dav1d headers are missing."
            exit 1
          }

          echo "YTUHD codec libraries ready."

          lipo -info vendor/libvpx_ios/libvpx.a \
            || file vendor/libvpx_ios/libvpx.a

          lipo -info vendor/dav1d_ios/libdav1d.a \
            || file vendor/dav1d_ios/libdav1d.a

      # ============================================================
      # Fix YTUHD aggregate-build paths
      #
      # YTUHD assumes THEOS_PROJECT_DIR is the YTUHD directory when
      # built standalone. uYouEnhanced builds it as a subproject.
      # ============================================================

      - name: Fix YTUHD Paths for Aggregate Build
        if: ${{ inputs.ytuhd }}
        run: |
          set -euo pipefail

          cd main/Tweaks/YTUHD

          python3 <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text()

          marker = "YTUHD_ROOT := $(abspath $(dir $(lastword $(MAKEFILE_LIST))))"

          if marker not in text:
              text = marker + "\n\n" + text

          text = text.replace(
              "$(THEOS_PROJECT_DIR)/vendor",
              "$(YTUHD_ROOT)/vendor"
          )

          path.write_text(text)
          PY

          if grep -q '\$(THEOS_PROJECT_DIR)/vendor' Makefile; then
            echo "FATAL: YTUHD vendor paths were not fully patched."
            exit 1
          fi

          echo "YTUHD aggregate paths patched."

      # ============================================================
      # Build
      # ============================================================

      - name: Build Package
        id: build_package
        run: |
          set -euo pipefail

          cd main

          echo "========================================"
          echo "Build configuration"
          echo "========================================"

          echo "SDK:                 ${{ inputs.sdk_version }}"
          echo "Minimum iOS:         16.0"
          echo "YouTube:             ${{ steps.prepare_youtube.outputs.youtube_version }}"
          echo "uYou source:         ${{ inputs.uyou_version }}"
          echo "uYou effective:      ${{ steps.uyou_version.outputs.effective_version }}"
          echo "Bundle ID:           ${{ inputs.bundle_id }}"
          echo "App name:            ${{ inputs.app_name }}"
          echo "YTUHD:               ${{ inputs.ytuhd }}"
          echo "iSponsorBlock:       ${{ inputs.sponsorblock }}"
          echo "SIDELOAD:            1"

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            IPA=Payload/YouTube.app \
            FINALPACKAGE=1 \
            SIDELOAD=1 \
            SDK_VERSION="${{ inputs.sdk_version }}" \
            YOUTUBE_VERSION="${{ steps.prepare_youtube.outputs.youtube_version }}" \
            UYOU_VERSION="${{ inputs.uyou_version }}" \
            BUNDLE_ID="${{ inputs.bundle_id }}" \
            DISPLAY_NAME="${{ inputs.app_name }}" \
            YTUHD_ENABLED=${{ inputs.ytuhd && '1' || '0' }} \
            SPONSORBLOCK_ENABLED=${{ inputs.sponsorblock && '1' || '0' }}

          PACKAGE_FILE="$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name "*.ipa" \
              -print0 \
              | xargs -0 ls -t \
              | head -n1 \
              || true
          )"

          if [ -z "$PACKAGE_FILE" ] || [ ! -f "$PACKAGE_FILE" ]; then
            echo "FATAL: No IPA was created."
            ls -lah packages || true
            exit 1
          fi

          PACKAGE_NAME="$(basename "$PACKAGE_FILE")"
          PACKAGE_PATH="$(pwd)/$PACKAGE_FILE"

          echo ""
          echo "Built IPA:"
          ls -lh "$PACKAGE_FILE"

          echo ""
          echo "SHA256:"
          shasum -a 256 "$PACKAGE_FILE"

          echo "package=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Final IPA verification
      # ============================================================

      - name: Verify Final IPA
        id: final_ipa
        run: |
          set -euo pipefail

          IPA_FILE="${{ steps.build_package.outputs.package_path }}"

          if [ -z "$IPA_FILE" ] || [ ! -f "$IPA_FILE" ]; then
            echo "FATAL: Final IPA does not exist:"
            echo "$IPA_FILE"
            exit 1
          fi

          IPA_NAME="$(basename "$IPA_FILE")"

          echo "Final IPA:"
          echo "$IPA_FILE"

          ls -lh "$IPA_FILE"

          echo ""
          echo "SHA256:"
          shasum -a 256 "$IPA_FILE"

          echo "path=$IPA_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # GitHub Actions artifact
      # ============================================================

      - name: Upload IPA Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v6
        with:
          name: >-
            uYouEnhanced_${{
            steps.prepare_youtube.outputs.youtube_version
            }}_${{
            steps.uyou_version.outputs.effective_version
            }}_run-${{ github.run_number }}
          path: ${{ steps.final_ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ============================================================
      # Draft GitHub release
      # ============================================================

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: >-
            v${{
            steps.prepare_youtube.outputs.youtube_version
            }}-${{
            steps.uyou_version.outputs.effective_version
            }}-${{ github.run_number }}

          name: >-
            uYouEnhanced ${{
            steps.prepare_youtube.outputs.youtube_version
            }}-${{
            steps.uyou_version.outputs.effective_version
            }} (Run ${{ github.run_number }})

          draft: true
          prerelease: false
          generate_release_notes: false

          files: ${{ steps.final_ipa.outputs.path }}

          body: |
            uYouEnhanced build

            YouTube: ${{ steps.prepare_youtube.outputs.youtube_version }}
            uYou source: ${{ inputs.uyou_version }}
            uYou packaged: ${{ steps.uyou_version.outputs.effective_version }}
            Build SDK: ${{ inputs.sdk_version }}
            Minimum iOS: 16.0
            Bundle ID: ${{ inputs.bundle_id }}
            YTUHD: ${{ inputs.ytuhd }}
            iSponsorBlock: ${{ inputs.sponsorblock }}
            GitHub Actions Run: ${{ github.run_number }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
